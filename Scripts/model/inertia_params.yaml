# lite_dynamics_calib 重力辨识结果
# 由 `dynamics_calib identify` 生成，请勿手工编辑。
#
# ⚠️ 准静态下**只有一阶矩 m·c 必然可辨识**：
#    重力势能 U = Σ m_k·g·(o_k + R_k·c_k)_z，展开为
#      · g·(R_k (m_k·c_k))_z —— 只依赖一阶矩
#      · m_k·g·(o_k)_z      —— 依赖质量，但仅当该连杆原点会随
#                              近端关节垂直移动时才随 q 变化
#    因此 mass 只在部分连杆上可辨识（如肩 pitch 连杆原点固定在
#    基座上，其 mass 与 mx 列在数据上恒为 0）。
#    未列出的分量 = 不可辨识，取任何值都不影响 g(q)。
#
# ⚠️ 参数本身**不唯一**（实测 rank 28 / 68，条件数可见 solver.rank）。
#    零空间里的分量取值由求解器边界或 prior 决定，**不是物理量** ——
#    例如某个 gripper 连杆的 mass 可能明显偏大。
#    但 (mass, first_moment) **成对使用**时，g(q) 的预测是唯一的：
#    把两者一起写回模型再 rnea，可精确复现辨识结果（已验证 |rnea(θ)−Wθ|=0）。
#    ⇒ 运行时请**成对**使用这两个字段，不要单独解读 mass 或 com。
