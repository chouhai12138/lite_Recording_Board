# =============================================================================
#  WCH-Link (1a86:8012) 接口配置 —— 实验性
#
#  思路：WCH-Link 的 ARM 模式使用厂商自定义 bulk 接口（EP 0x02 OUT / 0x83 IN），
#        这里强行让 OpenOCD 的 CMSIS-DAP(v2, usb_bulk) 后端去打开它。
#        如果该固件的 ARM 模式确实兼容 CMSIS-DAP v2，就能直接烧 STM32；
#        如果不兼容，OpenOCD 会在握手阶段报 "CMSIS-DAP command failed" /
#        "unable to find a matching CMSIS-DAP device"。
#
#  前置条件（否则一律报 Access denied）：
#      sudo cp tools/99-openocd.rules /etc/udev/rules.d/
#      sudo udevadm control --reload-rules && sudo udevadm trigger
#      拔插一次 WCH-Link
#
#  用法（脚本会自动带上）：
#      tools/flash.sh wch build/firmware.elf
#      openocd -f tools/wchlink.cfg -f target/stm32f4x.cfg -c "init"
# =============================================================================

adapter driver cmsis-dap
cmsis_dap_backend usb_bulk
cmsis_dap_vid_pid 0x1a86 0x8012
transport select swd

# 排障用：如果目标跑在高频时偶发读不到 AHB-AP（DPIDR 能读、AP 扫描失败），
# 可以打开下面这行“复位期间连接”，前提是调试器 NRST 接到了板子 NRST。
# reset_config srst_only srst_nogate connect_assert_srst
